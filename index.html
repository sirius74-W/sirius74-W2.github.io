<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194e42">
  <meta name="description" content="シフトから給与を計算し、毎日の収入と支出をひとつのカレンダーで管理する、こよみ帳。">
  <title>こよみ帳｜給与と収支のカレンダー</title>
  <style>:root {
 color-scheme:light;
 --ink:#213a32; --muted:#596c63; --line:#dfe6df; --paper:#f6f7f2; --green:#184e40;
 --mint:#e7f2eb; --rust:#a94b30; --peach:#fbede4; --blue:#3c638f; --bluebg:#e9eff8;
 font-family:"Inter","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
 font-size:16px; color:var(--ink); background:var(--paper); font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0;min-width:300px}
button,input,select{font:inherit;color:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button{border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b06b26;outline-offset:3px}
button:disabled{cursor:default;opacity:.5}
button[hidden],[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{transition:background .15s,color .15s,box-shadow .15s}
h1,h2,h3,p{margin:0}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.18em;flex-shrink:0;stroke-width:1.8}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.top-inner,.wrap{width:min(1280px,calc(100% - 8vw));margin:0 auto}
.top-inner{display:flex;align-items:center;gap:clamp(30px,6vw,100px);min-height:74px}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:1.5rem;color:#143e34;font-weight:800;letter-spacing:-.055em;white-space:nowrap}
.brandmark{width:38px;height:38px;display:flex;gap:3px;align-items:flex-end;padding:10px 8px 9px;background:var(--green);border-radius:12px;transform:rotate(-4deg);box-shadow:inset 0 0 0 1px #143e34}
.brandmark i{display:block;width:5px;background:#d5e7b3;border-radius:2px}
.brandmark i:nth-child(1){height:8px}.brandmark i:nth-child(2){height:13px}.brandmark i:nth-child(3){height:19px;background:#f7ba72}
nav{display:flex;align-self:stretch;gap:clamp(12px,2.4vw,36px)}
nav button{display:flex;align-items:center;gap:7px;position:relative;padding:0 4px;color:var(--muted);font-size:.9rem;font-weight:650;white-space:nowrap}
nav button:hover,nav button.active{color:var(--green)}
nav button.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green);border-radius:3px 3px 0 0}
.save-status{display:inline-flex;align-items:center;gap:7px;font-size:.79rem;color:var(--muted);white-space:nowrap;margin-left:auto}
.wrap{padding-top:34px}
.pagehead,.head-actions,.panel-head,.month-nav,.btn,.icon-box,.card-label,.mini-title,.form-actions,.form-head,.legend,.legend span,.controls,.detail-line,.demo-note{display:flex;align-items:center}
.pagehead,.panel-head,.form-head,.detail-line{justify-content:space-between;gap:15px}
.pagehead{margin:0 0 24px}
h1{font-size:clamp(1.7rem,2.7vw,2.35rem);line-height:1.35;letter-spacing:-.05em;font-weight:780}
.pagehead p{color:var(--muted);font-size:.93rem;margin-top:6px;line-height:1.6}
.head-actions,.form-actions{gap:14px}
.btn,.quiet,.icon-btn,.tiny-btn{border-radius:9px;font-weight:650}
.btn{gap:8px;justify-content:center;min-height:43px;padding:10px 17px;font-size:.91rem;white-space:nowrap}
.primary{background:var(--green);color:#fff;box-shadow:0 2px 3px #19392a10}
.primary:hover{background:#103e31}.outline{border:1px solid #cbd8ce;background:#fff}
.outline:hover,.icon-btn:hover,.tiny-btn:hover,.quiet:hover,.textbtn:hover{background:#edf2eb}
.quiet{color:var(--muted);font-size:.86rem;padding:10px 8px}
.icon-btn,.tiny-btn{display:inline-grid;place-items:center;border:1px solid var(--line);background:#fff;min-width:34px;height:34px}
.icon-btn{padding:0 7px}.tiny-btn{padding:0 12px;font-size:.82rem}
#demo-notice,#storage-warning{background:#fff5d9;color:#674c15;border:1px solid #e5d4a1;padding:10px 14px;font-size:.88rem;border-radius:10px;margin-bottom:16px}
#demo-notice button{text-decoration:underline;font-weight:bold}
.cards{display:grid;grid-template-columns:1.22fr 1fr 1fr;gap:16px;margin-bottom:22px}
.card,.panel{border:1px solid var(--line);border-radius:16px;background:#fff}
.card{position:relative;overflow:hidden;padding:20px 23px 18px;min-width:0}
.card.balance{isolation:isolate;background:var(--green);color:#fff;border-color:var(--green)}
.balance::before,.balance::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.balance::before{inset:0;opacity:.54;background:repeating-radial-gradient(ellipse 68% 140% at 104% 117%,transparent 0 10px,#91bba140 10.7px 11.6px,transparent 12.3px 17px);mask-image:linear-gradient(105deg,transparent 30%,#000 78%)}
.balance::after{width:88px;height:88px;right:-28px;bottom:-33px;border-radius:50%;background:#b3ca7d30}
.card-label{gap:9px;font-weight:680;font-size:.9rem}
.icon-box{width:30px;height:30px;justify-content:center;border-radius:9px}
.icon-box.income{color:#27725b;background:var(--mint)}.icon-box.expense{color:var(--rust);background:var(--peach)}.balance .icon-box{color:#e0edcf;background:#ffffff1c}
.card-amount{display:block;font-family:"Inter","Segoe UI",Arial,sans-serif;font-size:clamp(2rem,3.05vw,3rem);line-height:1.27;font-weight:650;letter-spacing:-.045em;margin:9px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.currency{font-size:.6em;letter-spacing:0;margin-right:4px;font-weight:500}
.card-note{color:var(--muted);font-size:.81rem}.balance .card-note{color:#d3e5d9}
.main-grid{display:grid;grid-template-columns:minmax(0,2.04fr) minmax(275px,1fr);gap:20px;align-items:start}
.side{display:grid;gap:16px}
.panel{min-width:0;overflow:hidden}
.panel-head{padding:20px 22px 16px}
h2{font-size:1.08rem;letter-spacing:-.025em;font-weight:750}
.month-title{font-size:1.26rem;letter-spacing:-.035em;white-space:nowrap}
.month-title small{display:block;color:var(--muted);font-size:.75rem;line-height:1.35;letter-spacing:.05em;font-weight:600}
.month-nav{gap:6px}
.calendar .panel-head{padding:20px 22px 15px}
.legend{gap:13px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
.legend span{gap:5px}
.legend i,.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-shift{background:#4c8d76}.leg-income{background:#6587b1}.leg-expense{background:#c87d56}
.calendar .legend{padding:0 22px 16px}
.week,.grid-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f5f7f3;text-align:center;font-size:.85rem;font-weight:600;padding:8px 0}
.sun{color:#a35647}.sat{color:#526c8f}
.day{min-height:88px;min-width:0;text-align:left;padding:7px 6px 5px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;flex-direction:column;gap:3px;background:#fff}
.day:nth-child(7n){border-right:0}.day:nth-last-child(-n+7){border-bottom:0}
.day:hover{background:#f1f5ee}.day.outside{background:#fafbf8;color:#848c83}
.day.is-today{background:#f3f7ef;box-shadow:inset 0 2px #55866b}
.day-number{font:600 .9rem/24px "Inter","Segoe UI",sans-serif;min-width:24px;text-align:center;border-radius:50%}
.day.is-today .day-number{background:var(--green);color:white}
.chip{display:block;max-width:100%;border-radius:4px;padding:2px 5px;font-size:.75rem;font-weight:550;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.shift,.tag.shift{background:var(--mint);color:#255d48}
.chip.income,.tag.income{background:var(--bluebg);color:#395f87}
.chip.expense,.tag.expense{background:var(--peach);color:#8c482d}
.extra{font-size:.75rem;color:var(--muted)}
.period{color:var(--muted);font-size:.78rem;white-space:nowrap}
.donut-wrap{display:grid;place-items:center;padding:5px 0 17px}
.donut{display:grid;place-items:center;width:148px;aspect-ratio:1;border-radius:50%}
.donut>div{display:grid;align-content:center;justify-items:center;gap:3px;background:#fff;width:75%;height:75%;border-radius:50%}
.donut small{color:var(--muted);font-size:.75rem}.donut strong{font:650 1.15rem/1.25 "Inter","Segoe UI",sans-serif;letter-spacing:-.035em}
.category-list{list-style:none;padding:0 21px 17px;margin:0}
.category-list li{display:grid;grid-template-columns:11px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:33px;border-bottom:1px solid #edf0ea;font-size:.87rem}
.category-list li:last-child{border:0}.category-list b{font-variant-numeric:tabular-nums;font-size:.88rem}
.mini-title{gap:8px}.mini-title .ic{color:var(--green)}
.work-stats{display:grid;grid-template-columns:1fr 1fr;padding:2px 21px 20px;gap:10px}
.work-stats>div+div{border-left:1px solid var(--line);padding-left:18px}
.work-stats small{font-size:.77rem;color:var(--muted);display:block}
.work-stats strong{font-size:1.22rem;display:block;margin-top:5px;letter-spacing:-.03em}
.work-wage{margin:0 21px;padding:12px 0;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.work-wage b{color:var(--ink)}
footer{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.77rem;margin:28px 0 20px}
.footmark{width:10px;height:10px;border-radius:3px;background:#90af9b;transform:rotate(-5deg)}.footer-divider{width:1px;height:12px;background:#bdc9c0}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button,.segment button{font-size:.87rem;padding:7px 12px;border-radius:7px}
.filters button:hover{background:var(--paper)}.filters button.active{background:var(--mint);color:var(--green);font-weight:700}
.records-toolbar{border-block:1px solid var(--line);padding:12px 20px}
.row-item{display:grid;grid-template-columns:80px minmax(0,1fr) auto auto;align-items:center;gap:15px;padding:13px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:.93rem}
.row-item:hover{background:#f7f9f5}.row-item:last-child{border-bottom:0}
.row-item b,.preset-card strong,.form-preview strong{overflow-wrap:anywhere}
.row-item small{display:block;color:var(--muted);margin-top:4px;font-size:.77rem}
.row-right{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}
.pos{color:#286748}.neg{color:#995133}
.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;padding:4px 8px;font-size:.8rem;font-weight:650;white-space:nowrap}
.empty{padding:38px 20px;text-align:center;color:var(--muted);line-height:1.7}
.empty .ic{display:block;margin:0 auto 8px;width:24px;height:24px}
.preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.preset-card{position:relative;display:grid;align-content:start;gap:9px;text-align:left;border-radius:13px;background:white;border:1px solid var(--line);padding:18px 20px;min-height:128px}
.preset-card:hover{border-color:#a1b9aa;box-shadow:0 1px 5px #21392b10}
.preset-card small,.preset-card p{color:var(--muted);font-size:.82rem}
.preset-card.empty-slot{border-style:dashed;background:#fbfcf8}
.preset-card>.ic{position:absolute;right:15px;top:17px;color:var(--muted)}
dialog{border:1px solid #d1dbd1;border-radius:17px;padding:0;width:min(500px,calc(100% - 24px));max-height:90dvh;color:var(--ink);box-shadow:0 25px 85px #0c211c35;background:#fff}
dialog::backdrop{background:#162b2459}
body:has(dialog[open]){overflow:hidden}
.form-head{padding:20px 22px 15px;border-bottom:1px solid var(--line)}
.form-head h2{font-size:1.2rem}
.form-body{padding:18px 22px 20px}
.form-body label{display:grid;gap:5px;font-size:.86rem;font-weight:650}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:0 0 14px}
.field-grid>.full{grid-column:1/-1}
input,select{width:100%;min-width:0;border:1px solid #b9c8bd;border-radius:7px;background:#fff;padding:9px 10px;min-height:42px;font-size:1rem}
select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#52695d 50%),linear-gradient(135deg,#52695d 50%,transparent 50%);background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder{color:#76847a;font-weight:400}
.help,.field-grid .help{color:var(--muted);font-size:.78rem;line-height:1.6;font-weight:400}
.segment{display:flex;gap:4px;padding:4px;background:#eef2eb;border-radius:10px;margin-bottom:16px}
.segment button{flex:1;color:var(--muted)}
.segment button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #1c352022;font-weight:700}
.form-actions{justify-content:flex-end;gap:9px;margin-top:17px;flex-wrap:wrap}
.danger{color:#a44231;background:#fcf0ea;margin-right:auto}
.form-preview{padding:12px 14px;background:#edf4ed;border-radius:9px;font-size:.85rem;line-height:1.6}
.form-preview strong{color:var(--green)}
.error{font-size:.86rem;color:#9e3525;margin:8px 0}
.day-list{margin:0 -12px}.day-list .row-item{grid-template-columns:minmax(0,1fr) auto auto;padding:13px 10px}
.day-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.day-actions button{flex:1}
.toast,#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:95%;width:max-content;z-index:4;background:#233f34;color:#fff;border-radius:30px;padding:9px 18px;font-size:.86rem;box-shadow:0 4px 16px #0e271e28}
#toast:empty{display:none}
@media(min-width:1450px){.day{min-height:100px}}
@media(max-width:950px){.top-inner,.wrap{width:calc(100% - 40px)}.top-inner{gap:35px}.main-grid{grid-template-columns:minmax(0,1.9fr) minmax(248px,1fr);gap:14px}.day{min-height:76px}.panel-head,.calendar .panel-head{padding:16px}.calendar .legend{padding-left:16px}.cards{gap:12px}.card{padding:16px}.category-list{padding-inline:15px}.preset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:740px){.top-inner{flex-wrap:wrap;gap:0;min-height:0}.brand{padding:12px 0;font-size:1.3rem}.brandmark{width:31px;height:31px;padding:7px 6px;gap:2px}.brandmark i:nth-child(3){height:17px}.save-status{order:1}nav{order:2;width:100%;justify-content:space-between;gap:4px}nav button{padding:11px 5px}.wrap{padding-top:22px}.pagehead{align-items:flex-start}.head-actions{gap:3px;flex-wrap:wrap;justify-content:flex-end}.pagehead p{font-size:.84rem}.main-grid{grid-template-columns:1fr}.side{grid-template-columns:1.2fr 1fr;align-items:start}.day{min-height:74px}.card{padding:13px}.card-label{font-size:.81rem;gap:5px}.card-amount{font-size:1.8rem}.card-note{font-size:.75rem}.icon-box{width:25px;height:25px}}
@media(max-width:540px){.top-inner,.wrap{width:calc(100% - 24px)}.brand{font-size:1.22rem}nav button{font-size:.83rem}.pagehead{flex-wrap:wrap;gap:12px;margin-bottom:15px}.pagehead h1{font-size:1.7rem}.head-actions{width:100%;justify-content:space-between;flex-direction:row-reverse}.btn{min-height:40px;padding:8px 12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.card{border-radius:12px;padding:12px 14px}.balance{grid-column:1/-1}.balance .card-amount{font-size:2.2rem}.balance .card-note{position:absolute;right:14px;bottom:15px}.card-amount{margin:4px 0 2px}.calendar .panel-head{padding:14px 12px 10px}.calendar .legend{padding:0 12px 10px}.day{min-height:67px;padding:3px 1px;gap:1px}.day-number{line-height:21px;min-width:21px;font-size:.81rem}.chip{font-size:.75rem;padding:1px 2px;max-width:100%}.side{grid-template-columns:1fr}.month-title{font-size:1.12rem}.week{font-size:.78rem;padding:6px 0}.preset-grid{grid-template-columns:1fr}.row-item{grid-template-columns:54px minmax(0,1fr) auto;gap:7px;padding:11px 12px}.row-item>.ic{display:none}.day-list .row-item{grid-template-columns:minmax(0,1fr) auto}.form-body{padding:16px}.form-head{padding:15px 16px}.filters{gap:1px}.filters button{padding:6px 9px}.records-toolbar{padding:10px}.field-grid{gap:10px}.quiet{font-size:.82rem}.empty{padding:24px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


.cloud-controls{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap}
#account-content,.import-review{display:grid;gap:14px}
#account-content button{justify-self:start}.import-review{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
#account-result:not(:empty){margin-top:12px;font-weight:bold}
@media(max-width:950px){.top-inner{gap:16px}.cloud-controls{gap:6px}.cloud-controls .save-status{font-size:.76rem}}
@media(max-width:740px){.top-inner{gap:0}.cloud-controls{order:1}}
@media(max-width:420px){.cloud-controls{gap:3px}.cloud-controls .tiny-btn{padding:0 6px}.cloud-controls .save-status{max-width:82px;white-space:normal}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a href="#calendar" class="brand" aria-label="こよみ帳 ホーム"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>こよみ帳</a>
      <nav aria-label="メインメニュー">
        <button type="button" data-view="calendar"><span data-icon="calendar"></span>カレンダー</button>
        <button type="button" data-view="records"><span data-icon="list"></span>収支明細</button>
        <button type="button" data-view="presets"><span data-icon="clock"></span>勤務パターン</button>
      </nav>
      <div class="cloud-controls"><span id="save-status" class="save-status" role="status">この端末に保存</span><button id="account-button" class="tiny-btn" type="button">ログイン・同期</button></div>
    </div>
  </header>
  <main class="wrap">
    <div id="storage-warning" role="status" hidden></div>
    <section class="pagehead">
      <div><h1 id="view-title">収支カレンダー</h1><p id="view-desc">シフトと日々のお金の動きを、ひとつのカレンダーに。</p></div>
      <div class="head-actions"><button id="demo" class="quiet">記入例を見る</button><button id="primary" class="btn primary"></button></div>
    </section>
    <div id="demo-notice" hidden>記入例を表示しています。<button type="button" data-action="exit-demo">自分の帳簿に戻る</button></div>
    <div id="view-content"></div>
    <footer><span class="footmark"></span>こよみ帳<span class="footer-divider"></span>給与・収支管理</footer>
  </main>
  <dialog id="sheet" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <dialog id="account-sheet" aria-labelledby="account-title">
    <div class="form-head"><h2 id="account-title">アカウントと同期</h2><button class="icon-btn" type="button" id="account-close" aria-label="閉じる">×</button></div>
    <div class="form-body"><div id="account-content"></div><p id="account-result" role="status"></p></div>
  </dialog>
  <output id="toast" role="status" aria-live="polite"></output>
  <noscript>この帳簿を使うには、ブラウザーの JavaScript を有効にしてください。</noscript>
  <script src="./config.js"></script>
  <script>(() => {

"use strict";

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const storeKey = "koyomi-ledger:v1:" + location.pathname.replace(/(?:\/index\.html|\/)$/, "/");
const today = dateKey(new Date());
const fmt = new Intl.NumberFormat("ja-JP", {maximumFractionDigits: 0});
const yen = n => "¥" + fmt.format(n);
const kindLabel = {shift:"勤務", income:"収入", expense:"支出"};
const categories = ["食費", "交通費", "娯楽費", "交際費", "日用品", "その他"];
const palette = ["#477d66", "#c88452", "#7c91ac", "#ccaa59", "#9c87a6", "#8a9681", "#b57176", "#4d9192"];
const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
const fresh = () => ({records:[], presets:Array(10).fill(null)});
const iconPaths = {
 calendar:'<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M7.5 3v4m9-4v4M4 10h16m-12 4h2m4 0h2"/>',
 list:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8m-8 4h5"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2.2"/>',
 device:'<rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M9 20h6m-3-3v3"/>',
 wallet:'<path d="M19 8V5a1 1 0 0 0-1-1L5 6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a1 1 0 0 0-1-1H5"/><path d="M21 12h-5v4h5"/>',

  if(value.type!=="shift")return false;

 return textOK(value.name,40)&&Number.isInteger(value.rate)&&value.rate>0&&value.rate<=999999&&
 typeof value.start==="string"&&typeof value.end==="string"&&Number.isFinite(mins)&&mins>0&&

 openSheet(jpDate(date),`${rows.length?`<div class="day-list">${rows.map(r=>rowHTML(r,false)).join("")}</div>`:`<p class="empty">${icon("calendar")}この日の記録はまだありません。</p>`}
 ${demo?"":`<div class="day-actions">${Object.entries(kindLabel).map(([k,v])=>`<button class="btn outline" data-new="${k}" data-on="${date}" type="button">${icon("plus")}${v}</button>`).join("")}</div>`}`);
}
function readonlyDetail(r){
 const lines=r.type==="shift"?[["勤務名",r.name],["時間",shiftTime(r)],["時給",yen(r.rate)],["休憩",(r.breakMin??autoBreak(elapsed(r.start,r.end)))+"分"],["実働時間",hours(netMinutes(r))],["給与見込み",yen(amount(r))]]:[["区分",kindLabel[r.type]],["金額",yen(amount(r))],...(r.category?[["カテゴリー",r.category]]:[])];
 openSheet(jpDate(r.date),lines.map(([k,v])=>`<p class="detail-line"><span>${esc(k)}</span><b>${esc(v)}</b></p>`).join("")+(r.note?`<p class="help">${esc(r.note)}</p>`:""));
}
function newValues(type,date){
 return type==="shift"?{type,date,name:"勤務",rate:"",start:"09:00",end:"17:00",breakMin:null,note:""}:{type,date,amount:"",category:"食費",note:""};
}
function defaultDate(){return month===today.slice(0,7)?today:month+"-01";}
function openEntry(type,date,id=null){
 const source=id?currentBook().records.find(row=>row.id===id):null;
 if(id&&!source) return;
 if(demo){if(source)readonlyDetail(source);return;}
 formState={mode:"entry",type:source?.type||type,id,drafts:{},date:source?.date||date,originDay:formState?.mode==="day"?formState.date:null};
 const values=source?{...source}:newValues(type,date);
 formState.key=id||newRecordId();formState.guard=editGuard("record",formState.key);
 formState.drafts[formState.type]=values;
 drawEntry(values);
}
function openPreset(index){
 const p=currentBook().presets[index];
 if(demo){
  if(p)readonlyDetail({...p,type:"shift",date:defaultDate()});
  else notify("記入例の空き枠です");
  return;
 }
 const values=p?{...p}:{name:"",rate:"",start:"09:00",end:"17:00",breakMin:null};
 formState={mode:"preset",index,type:"shift",existing:!!p,guard:editGuard("preset",String(index))};
 openSheet(`勤務パターン ${String(index+1).padStart(2,"0")}`,`<form id="entry-form"><div class="field-grid">${shiftFields(values,true)}</div>
 ${previewBox()}${actions(!!p)}</form>`);
 updatePreview();
}
function inputField(label,name,type,value,attrs="",full=false){
 return `<label class="${full?"full":""}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`;
}
function shiftFields(v,preset){
 return inputField(preset?"パターン名":"勤務名","name","text",v.name,'required maxlength="40" placeholder="例：カフェ早番"',true)
 +inputField("時給（円）","rate","number",v.rate,'required min="1" max="999999" step="1" inputmode="numeric" placeholder="例：1200"',true)
 +inputField("開始時刻","start","time",v.start,"required")
 +inputField("終了時刻","end","time",v.end,"required")
 +inputField("休憩（分）","breakMin","number",v.breakMin??"",'min="0" max="1439" step="1" inputmode="numeric" placeholder="空欄で自動計算"',true)
 +'<p class="help full">休憩の初期設定は、開始から終了までが6時間以内なら0分、6時間超なら45分、8時間超なら60分です。実際の休憩を入力すると、その分数を使います。</p>';
}
function previewBox(){return '<div class="form-preview" id="pay-preview" role="status"></div>';}
function actions(existing){
 return `<p id="draft-status" class="help" role="status"></p><p id="form-error" class="error" role="alert" hidden></p><div class="form-actions">${existing?'<button class="btn danger" type="button" data-action="delete">削除</button>':""}<button type="button" class="btn outline" data-action="cancel">キャンセル</button><button type="submit" class="btn primary">保存する</button></div>`;
}
function drawEntry(v){
 const {type,id}=formState;
 const tab=id?"":`<div class="segment" aria-label="記録の種類">${Object.entries(kindLabel).map(([k,v])=>`<button type="button" data-kind="${k}" class="${k===type?"active":""}" aria-pressed="${k===type}">${v}</button>`).join("")}</div>`;
 let fields=inputField("日付","date","date",v.date,'required min="1000-01-01" max="9999-12-31"',true);
 if(type==="shift"){
  const configured=currentBook().presets.map((p,i)=>p?`<option value="${i}">${esc(p.name)}（時給 ${yen(p.rate)}）</option>`:"").join("");
  if(configured) fields+=`<label class="full">勤務パターン<select name="pattern"><option value="">個別に入力</option>${configured}</select></label>`;
  fields+=shiftFields(v,false);
 }else{
  fields+=inputField("金額（円）","amount","number",v.amount,'required min="1" max="999999999" step="1" inputmode="numeric" placeholder="例：800"',true);
  if(type==="expense"){
   const all=new Set([...categories,...book.records.filter(r=>r.type==="expense").map(r=>r.category)]);
   fields+=`<label class="full">カテゴリー<select name="category">${[...all].map(c=>`<option${c===v.category?" selected":""}>${esc(c)}</option>`).join("")}<option value="__custom__">＋ カテゴリーを追加</option></select></label>
   <label class="full" id="new-category" hidden>新しいカテゴリー名<input name="custom" maxlength="30" placeholder="例：書籍費"></label>`;
  }
 }
 fields+=inputField("メモ（任意）","note","text",v.note,'maxlength="100" placeholder="例：'+(type==="shift"?"勤務先":type==="expense"?"昼ごはん":"臨時収入")+'"',true);
 openSheet(id?`${kindLabel[type]}の記録を編集`:"記録を追加",`${tab}<form id="entry-form"><div class="field-grid">${fields}</div>${type==="shift"?previewBox():""}${actions(!!id)}</form>`);
 if(type==="expense" && !Array.from($('[name="category"]').options).some(o=>o.text===v.category)){
  $('[name="category"]').value="__custom__";$('#new-category').hidden=false;$('[name="custom"]').required=true;$('[name="custom"]').value=v.category??"";
 }
 updatePreview();
}
function valuesFromForm(){
 const f=$("#entry-form"), value=name=>f.elements.namedItem(name)?.value??"";
 const date=value("date"), type=formState.type, note=value("note").trim();
 if(type==="shift"){
  const p={name:value("name").trim(),rate:value("rate"),start:value("start"),end:value("end"),breakMin:value("breakMin")===""?null:Number(value("breakMin"))};
  return formState.mode==="preset"?p:{...p,type,date,note};
 }
 const row={type,date,note,amount:value("amount")};
 if(type==="expense")row.category=value("category")==="__custom__"?value("custom").trim():value("category");
 return row;
}
function updatePreview(){
 const output=$("#pay-preview");if(!output)return;
 const v=valuesFromForm(), span=elapsed(v.start,v.end), net=netMinutes(v);
 if(!span || !Number.isFinite(net) || net<=0 || !Number.isInteger(net)){output.textContent="開始・終了時刻と休憩時間を確認してください。";return;}
 const paid=Number(v.rate)>0?` ／ 給与見込み <strong>${yen(Math.round(Number(v.rate)*net/60))}</strong>`:"";
 output.innerHTML=`${v.end<v.start?"翌日終了 ／ ":""}休憩 ${v.breakMin??autoBreak(span)}分 ／ 実働 <strong>${hours(net)}</strong>${paid}<div class="help">勤務開始日に計上し、1勤務ごとに1円単位で四捨五入します。</div>`;
}
function showError(message){
 const err=$("#form-error");err.textContent=message;err.hidden=false;
}
function applyPattern(index){
 if(index==="")return;
 const p=currentBook().presets[Number(index)];if(!p)return;
 const f=$("#entry-form");
 for(const k of ["name","rate","start","end","breakMin"])f.elements.namedItem(k).value=p[k]??"";
 updatePreview();
}
async function saveForm(){
 const v=valuesFromForm(), state=formState;
 if(state.type==="shift"){
  const net=netMinutes(v);
  if(!v.name)return showError("勤務名を入力してください。");
  if(!elapsed(v.start,v.end))return showError("開始と終了には異なる時刻を指定してください。");
  if(!Number.isFinite(net)||net<=0)return showError("休憩時間は勤務時間より短くしてください。");
  v.rate=Number(v.rate);
 }else{
  v.amount=Number(v.amount);
  if(state.type==="expense"&&(!v.category||v.category==="__custom__"))return showError("カテゴリー名を入力してください。");
 }
 if(state.mode==="preset"){
  if(!await persistItem(state,"preset",String(state.index),v))return;
 }else{
  if(!await persistItem(state,"record",state.key,{...v,id:state.key}))return;
  month=v.date.slice(0,7);
 }
 if(formState!==state)return;
 render();
 if(state.originDay)dayDetails(v.date);else closeSheet();
 notify("保存しました");
}
function confirmDelete(){
 const state=formState, f=$("#entry-form");
 if($("#delete-check"))return;
 const p=document.createElement("div");p.id="delete-check";p.className="form-preview";
 p.innerHTML=`<p>${state.mode==="preset"?"この勤務パターンを削除しますか？ 登録済みのシフトは残ります。":"この記録を削除しますか？"}</p><div class="form-actions"><button type="button" class="btn outline" data-action="keep">戻る</button><button type="button" class="btn danger" data-action="confirm-delete">削除する</button></div>`;
 f.append(p);f.querySelector(".form-actions").hidden=true;p.querySelector("button").focus();p.scrollIntoView({block:"nearest"});
}
async function deleteRecord(){
 const state=formState, isPreset=state.mode==="preset";
 if(!await persistItem(state,isPreset?"preset":"record",isPreset?String(state.index):state.id,null))return;
 if(formState!==state)return;
 render();if(state.originDay)dayDetails(state.originDay);else closeSheet();notify("削除しました");
}

const accountSheet=$("#account-sheet");
function paintAccount(){
 if(!accountSheet.open)return;
 const e=s=>`<p class="help">${esc(s)}</p>`;
 let html="";
 if(sync.booting)html=e("ログイン状態を確認しています。");
 else if(!sync.user){
  html=e("現在はこの端末の帳簿です。同じGoogleアカウントでログインすると、PCとスマホでクラウド帳簿を共有できます。");
  if(!isConfigured())html+=e("管理者の設定待ちです。SETUP.md に沿ってSupabaseを設定し、config.jsに公開用の接続情報を入力してください。");
  else if(!sync.client)html+=e("ログイン機能を読み込めません。インターネット接続を確認して再読み込みしてください。");
  else html+='<button type="button" class="btn primary" data-account="login">Googleでログイン</button>';
 }else{
  html+=`<p><strong>${esc(sync.user.email||sync.user.id)}</strong></p>`+e("このアカウント専用のクラウド帳簿です。端末内の記録は、取り込みを選んだときだけコピーされます。");
  html+='<button class="btn outline" data-account="refresh">最新の帳簿を取得</button>';
  if(sync.ready&&!sync.importPlan)html+='<button class="btn outline" data-account="preview">端末内の記録を取り込む</button>';
  if(sync.importPlan){
   const plan=sync.importPlan;const n=type=>plan.items.filter(i=>type==="preset"?i.kind==="preset":i.value.type===type).length;
   html+=`<div class="import-review"><strong>取り込み内容</strong><p>勤務 ${n("shift")}件 ／ 収入 ${n("income")}件 ／ 支出 ${n("expense")}件 ／ 勤務パターン ${n("preset")}件</p>
   ${e("保存先："+(sync.user.email||sync.user.id))}${e("この端末の旧URL（idx.html）の記録も対象です。同じIDや使用済みのパターン枠は飛ばし、既存のクラウド記録を優先します。端末内の元データは残ります。")}
   ${plan.duplicate?e("旧URLと重なる "+plan.duplicate+" 件は、現在のURLのデータを優先しました。"):""}
   ${plan.items.length?'<button class="btn primary" data-account="import">このアカウントに取り込む</button>':e("取り込める記録はありません。入力したブラウザー・URLを確認してください。")}
   <button class="quiet" data-account="dismiss-plan">戻る</button></div>`;
  }
  html+='<button class="quiet" data-account="logout">このブラウザーからログアウト</button>';
 }
 if(sync.error)html+=e(sync.error);
 $("#account-content").innerHTML=html;
 accountSheet.querySelectorAll("[data-account]").forEach(b=>b.disabled=sync.busy);
 $("#account-close").disabled=sync.busy;
}
function openAccount(){if(!accountSheet.open)accountSheet.showModal();paintAccount();}
async function accountAction(action){
 if(sync.busy)return;
 const uid=cloudId(),epoch=sync.epoch;
 if(action==="refresh"){await fetchCloud();return;}
 if(action==="dismiss-plan"){sync.importPlan=null;paintAccount();return;}
 if(action==="preview"){
  try{sync.importPlan=collectLocal();cloudWarning("");}catch{sync.importPlan=null;cloudWarning("端末内の記録を読み取れません。元データは保持されています。");}
  paintAccount();return;
 }
 if(!sync.client)return;
 sync.busy=true;paintAccount();refreshBadge();
 try{
  if(action==="login"){
   const redirect=new URL("./",location.href).href;
   const {error}=await sync.client.auth.signInWithOAuth({provider:"google",options:{redirectTo:redirect,queryParams:{prompt:"select_account"}}});
   if(error)throw error;
  }else if(action==="logout"){
   const {error}=await sync.client.auth.signOut({scope:"local"});
   if(error)throw error;
   identity(null);
  }else if(action==="import"&&uid&&sync.importPlan){
   const plan=sync.importPlan;
   const potential=plan.items.length;
   const {data,error}=await sync.client.rpc("koyomi_import",{p_owner:uid,p_items:plan.items});
   if(error)throw error;
   if(epoch!==sync.epoch)return;
   if(!Number.isInteger(data)||data<0||data>potential)throw Error("import result");
   sync.importPlan=null;
   sync.busy=false;sync.message="";
   await fetchCloud();
   if(epoch!==sync.epoch)return;
   $("#account-result").textContent=`取り込み完了：追加 ${data}件、登録済みなどでスキップ ${potential-data}件。`;
  }
 }catch{
  if(epoch===sync.epoch)cloudWarning(action==="import"?"取り込み完了を確認できませんでした。再実行しても同じ記録は重複しません。":"接続できませんでした。通信、認証設定、許可されたURLを確認してください。");
 }finally{
  if(epoch===sync.epoch){sync.busy=false;paintAccount();refreshBadge();}
 }
}
function loadAuthLibrary(){
 return new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js";
  script.crossOrigin="anonymous";script.onload=resolve;script.onerror=reject;
  document.head.appendChild(script);
 });
}
async function startAccount(){
 if(!isConfigured()){refreshBadge();return;}
 if(location.protocol!=="https:" && !["localhost","127.0.0.1"].includes(location.hostname)){
  cloudWarning("同期にはGitHub Pagesの公開URLを開いてください。");refreshBadge();return;
 }
 sync.booting=true;refreshView();
 try{
  await loadAuthLibrary();
  const project=new URL(config.url).hostname;
  const dir=location.pathname.slice(0,location.pathname.lastIndexOf("/")+1);
  const api=window.supabase.createClient(config.url,config.publishableKey,{auth:{
   flowType:"pkce",storageKey:`koyomi-auth:${project}:${dir}`,detectSessionInUrl:false
  }});
  sync.client=api;
  const url=new URL(location.href);
  if(url.searchParams.has("code")||url.searchParams.has("error")||url.hash.startsWith("#error=")){
   const code=url.searchParams.get("code");
   for(const key of ["code","error","error_description","error_code"])url.searchParams.delete(key);
   url.hash="";history.replaceState(null,"",url.href);
   if(code){
    const {error}=await api.auth.exchangeCodeForSession(code);
    if(error)cloudWarning("ログインを完了できません。同じブラウザーからもう一度ログインしてください。");
   }else cloudWarning("Googleログインは完了していません。再度ログインできます。");
  }
  api.auth.onAuthStateChange((_event,session)=>{
   // Avoid making another Supabase call while its session lock is held.
   setTimeout(()=>identity(session?.user??null),0);
  });
  const {data,error}=await api.auth.getSession();if(error)throw error;
  identity(data.session?.user??null);
 }catch{
  sync.booting=false;
  cloudWarning("認証サービスに接続できませんでした。接続情報と通信を確認し、再読み込みしてください。");
  refreshView();paintAccount();
 }
}
function syncOnReturn(){
 if(document.visibilityState==="visible"&&sync.user&&!sync.busy&&!sync.loading)void fetchCloud();
}
$("#account-button").addEventListener("click",openAccount);
$("#account-close").addEventListener("click",()=>{if(!sync.busy)accountSheet.close();});
accountSheet.addEventListener("close",()=>{sync.importPlan=null;$("#account-content").replaceChildren();$("#account-result").textContent="";});
accountSheet.addEventListener("cancel",e=>{if(sync.busy)e.preventDefault();});
dialog.addEventListener("cancel",e=>{if(sync.busy)e.preventDefault();});
accountSheet.addEventListener("click",e=>{const b=e.target.closest("[data-account]");if(b)void accountAction(b.dataset.account);});
document.addEventListener("visibilitychange",syncOnReturn);
window.addEventListener("focus",syncOnReturn);
window.addEventListener("online",syncOnReturn);
window.addEventListener("offline",()=>{if(sync.user){cloudWarning("オフラインです。クラウドへの保存は接続回復後に行ってください。");refreshBadge();}});



function setView(name){
 view=["calendar","records","presets"].includes(name)?name:"calendar";
 refreshView();
}
function changeView(name){if(location.hash==="#"+name)setView(name);else location.hash=name;}
function exitDemo(){
 demo=false;sample=null;month=today.slice(0,7);
 $("#save-status").innerHTML=icon("device")+"この端末に保存";
 render();
}
const actionsMap={
 close:closeSheet,
 cancel:()=>{if(formState?.originDay)dayDetails(formState.originDay);else closeSheet();},
 next:()=>{if(month<"9999-12"){month=shiftMonth(month,1);render();}},
 prev:()=>{if(month>"1000-01"){month=shiftMonth(month,-1);render();}},
 today:()=>{month=today.slice(0,7);render();},
 "exit-demo":exitDemo,
 delete:confirmDelete,
 keep:()=>{$("#delete-check").remove();$("#entry-form .form-actions").hidden=false;$('#entry-form [data-action="delete"]').focus();},
 "confirm-delete":deleteRecord
};
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const d=b.dataset;
 if(d.action && actionsMap[d.action]){actionsMap[d.action]();return;}
 if(d.view){changeView(d.view);return;}
 if(d.date){dayDetails(d.date);return;}
 if(d.new){openEntry(d.new,d.on);return;}
 if(d.entry){openEntry(null,null,d.entry);return;}
 if(d.preset!==undefined){openPreset(Number(d.preset));return;}
 if(d.filter){filter=d.filter;render();return;}
 if(d.kind && d.kind!==formState.type){
  const old=valuesFromForm();formState.drafts[formState.type]=old;formState.type=d.kind;
  const v=formState.drafts[d.kind]||newValues(d.kind,old.date);
  v.date=old.date;drawEntry(v);return;
 }
 if(b.id==="primary"){
  if(view==="presets"){const i=currentBook().presets.findIndex(p=>!p);if(i>=0)openPreset(i);}
  else openEntry("shift",defaultDate());
 }
 if(b.id==="demo"){
  demo=true;sample=sampleBook(month);$("#save-status").innerHTML=icon("device")+"記入例を表示中";render();
 }
});
document.addEventListener("change",e=>{
 if(e.target.name==="pattern")applyPattern(e.target.value);
 if(e.target.name==="category"){
  const custom=e.target.value==="__custom__";$("#new-category").hidden=!custom;$('[name="custom"]').required=custom;if(custom)$('[name="custom"]').focus();
 }
});
document.addEventListener("input",e=>{
 if(e.target.closest("#entry-form")){
  if(cloudId()){const hint=$("#draft-status");if(hint)hint.textContent="入力中・未保存";}
  const err=$("#form-error");if(err)err.hidden=true;
  updatePreview();
 }
});
document.addEventListener("submit",e=>{
 if(e.target.id==="entry-form"){e.preventDefault();saveForm();}
});
dialog.addEventListener("close",()=>{
 formState=null;
 if(focusToken?.isConnected)focusToken.focus();
 else if(focusToken?.dataset.date)$(`[data-date="${focusToken.dataset.date}"]`)?.focus();
 else if(!$("#primary").hidden)$("#primary").focus();
 focusToken=null;
});
window.addEventListener("hashchange",()=>setView(location.hash.slice(1)));
window.addEventListener("storage",e=>{
 if(sync.user||sync.booting||(e.key!==storeKey&&e.key!==null))return;
 try{book=readBook();loadFailed=false;if(!demo)render();}catch{storageWarning("保存データを確認できません。ページを再読み込みしてください。");}
});
for(const span of $$("[data-icon]"))span.innerHTML=icon(span.dataset.icon);
setView(location.hash.slice(1));
void startAccount();


})();</script>
